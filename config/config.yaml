genome: hg38

sequence:
  promoter_bp: 2000    # TSS ±1kb
  enhancer_bp: 1000    # 增强子窗口（中心±500bp）
  top_k: 5             # Top-K增强子，先用Promoter-only时可忽略

marks:
  core: [H3K4me3, H3K27ac, H3K4me1, H3K36me3, H3K27me3, H3K9me3, H3K9ac]
  extra: [ATAC, POLR2A]   # 可按可用性开启
# 实际使用通道 = marks.core + marks.extra
use_extra: false

eids: [E003, E004, E005, E006, E007, E016, E066, E114, E116, E118]

# 表达值处理配置
expression:
  transform: log2_rpkm_plus1  # 表达值变换方式: log2_rpkm_plus1 / identity / raw
  # log2_rpkm_plus1: 应用 log2(RPKM+1) 变换

paths:
  genome_sizes: preprocessing/annotations/hg38.fa.sizes
  gtf: preprocessing/annotations/gencode.v49.primary_assembly.annotation.gtf.gz
  promoters_bed: preprocessing/annotations/promoters_2kb.hg38.bed
  enhancer_map: #annotations/gene_enhancer_map_ABC.tsv   # 可为空，Promoter-only时不使用
  stats_json: preprocessing/annotations/signal_stats.json             # 信号分位数/缩放统计
  expression: exp/raw_exp.final.tsv  # 原始 RPKM 表达值文件